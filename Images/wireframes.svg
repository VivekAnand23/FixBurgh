<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="720" fill="#F7FAFC"/>
  <text x="600" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#1B4F86">Key Screens (low-fidelity wireframes)</text>
  <text x="600" y="62" text-anchor="middle" font-size="14" fill="#4A5568">Bottom navigation: Map · Report (center action) · My Reports · Profile</text>

  <!-- reusable phone frame via groups -->
  <!-- Phone 1: Map -->
  <g transform="translate(40,90)">
    <rect width="260" height="560" rx="34" fill="#1A202C"/>
    <rect x="10" y="10" width="240" height="540" rx="26" fill="#FFFFFF"/>
    <rect x="95" y="18" width="70" height="16" rx="8" fill="#1A202C"/>
    <text x="24" y="62" font-size="16" font-weight="700" fill="#1B4F86">FixBurgh</text>
    <rect x="24" y="74" width="212" height="32" rx="16" fill="#EDF2F7"/>
    <text x="40" y="95" font-size="12" fill="#718096">Search address or area</text>
    <rect x="10" y="116" width="240" height="306" fill="#E6EFE9"/>
    <path d="M10 220 C 80 200, 150 260, 250 230" stroke="#FFFFFF" stroke-width="10" fill="none"/>
    <path d="M60 116 C 80 250, 140 330, 120 422" stroke="#FFFFFF" stroke-width="8" fill="none"/>
    <path d="M10 360 C 90 340, 170 390, 250 350" stroke="#9AC6E8" stroke-width="12" fill="none"/>
    <circle cx="90" cy="205" r="9" fill="#B4530E" stroke="#FFF" stroke-width="2"/>
    <rect x="165" y="240" width="16" height="16" fill="#1B4F86" stroke="#FFF" stroke-width="2"/>
    <polygon points="140,290 150,308 130,308" fill="#3A9284" stroke="#FFF" stroke-width="2"/>
    <circle cx="200" cy="330" r="9" fill="#B4530E" stroke="#FFF" stroke-width="2"/>
    <rect x="60" y="390" width="16" height="16" fill="#7B4FA0" stroke="#FFF" stroke-width="2"/>
    <rect x="24" y="126" width="64" height="24" rx="12" fill="#FFFFFF" stroke="#CBD5E0"/>
    <text x="56" y="142" text-anchor="middle" font-size="11" fill="#1A202C">Filters</text>
    <rect x="22" y="380" width="216" height="0" fill="none"/>
    <rect x="24" y="430" width="212" height="28" rx="8" fill="#FFF4EC"/>
    <text x="34" y="448" font-size="11" fill="#1A202C">Pothole · 0.2 mi · 12 "Me too"</text>
    <rect x="10" y="494" width="240" height="56" rx="0" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="130" cy="494" r="26" fill="#B4530E"/>
    <text x="130" y="503" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">+</text>
    <text x="45" y="530" text-anchor="middle" font-size="10" font-weight="700" fill="#1B4F86">Map</text>
    <text x="130" y="538" text-anchor="middle" font-size="10" fill="#4A5568">Report</text>
    <text x="190" y="530" text-anchor="middle" font-size="10" fill="#4A5568">Mine</text>
    <text x="230" y="530" text-anchor="middle" font-size="10" fill="#4A5568">Me</text>
  </g>
  <text x="170" y="680" text-anchor="middle" font-size="14" font-weight="700" fill="#1A202C">Community map</text>
  <text x="170" y="700" text-anchor="middle" font-size="12" fill="#4A5568">Pins use color + shape per category</text>

  <!-- Phone 2: Report details -->
  <g transform="translate(330,90)">
    <rect width="260" height="560" rx="34" fill="#1A202C"/>
    <rect x="10" y="10" width="240" height="540" rx="26" fill="#FFFFFF"/>
    <rect x="95" y="18" width="70" height="16" rx="8" fill="#1A202C"/>
    <text x="24" y="62" font-size="13" fill="#4A5568">‹ Back</text>
    <text x="236" y="62" text-anchor="end" font-size="12" fill="#4A5568">Step 3 of 4</text>
    <rect x="24" y="72" width="212" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="24" y="72" width="159" height="6" rx="3" fill="#B4530E"/>
    <rect x="24" y="90" width="212" height="100" rx="10" fill="#CBD5E0"/>
    <text x="130" y="145" text-anchor="middle" font-size="12" fill="#4A5568">[ photo ]</text>
    <rect x="152" y="166" width="78" height="18" rx="9" fill="#FFFFFF"/>
    <text x="191" y="179" text-anchor="middle" font-size="9" fill="#1B4F86">AI: Pothole 92%</text>
    <text x="24" y="214" font-size="13" font-weight="700" fill="#1A202C">What is it?</text>
    <g font-size="10" text-anchor="middle" fill="#1A202C">
      <rect x="24" y="224" width="50" height="46" rx="8" fill="#FFF4EC" stroke="#B4530E" stroke-width="2"/><text x="49" y="262">Pothole</text>
      <rect x="78" y="224" width="50" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E0"/><text x="103" y="262">Slide</text>
      <rect x="132" y="224" width="50" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E0"/><text x="157" y="262">Flood</text>
      <rect x="186" y="224" width="50" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E0"/><text x="211" y="262">Light</text>
      <rect x="24" y="274" width="50" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E0"/><text x="49" y="312">Dumping</text>
      <rect x="78" y="274" width="50" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E0"/><text x="103" y="312">Tree</text>
      <rect x="132" y="274" width="50" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E0"/><text x="157" y="312">Sidewalk</text>
      <rect x="186" y="274" width="50" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E0"/><text x="211" y="312">Other</text>
    </g>
    <text x="24" y="344" font-size="13" font-weight="700" fill="#1A202C">How bad?</text>
    <g font-size="11" text-anchor="middle">
      <rect x="24" y="352" width="68" height="30" rx="15" fill="#FFFFFF" stroke="#CBD5E0"/><text x="58" y="371" fill="#1A202C">Low</text>
      <rect x="96" y="352" width="68" height="30" rx="15" fill="#1B4F86"/><text x="130" y="371" fill="#FFFFFF">Medium</text>
      <rect x="168" y="352" width="68" height="30" rx="15" fill="#FFFFFF" stroke="#CBD5E0"/><text x="202" y="371" fill="#1A202C">Urgent</text>
    </g>
    <rect x="24" y="394" width="212" height="70" rx="8" fill="#FFFFFF" stroke="#CBD5E0"/>
    <text x="34" y="414" font-size="11" fill="#718096">Describe it (optional)</text>
    <text x="222" y="456" text-anchor="end" font-size="14" fill="#1B4F86">🎤</text>
    <rect x="24" y="480" width="212" height="44" rx="22" fill="#B4530E"/>
    <text x="130" y="507" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Next: who fixes it</text>
  </g>
  <text x="460" y="680" text-anchor="middle" font-size="14" font-weight="700" fill="#1A202C">Report details</text>
  <text x="460" y="700" text-anchor="middle" font-size="12" fill="#4A5568">Big tap targets, AI suggestion pre-selected</text>

  <!-- Phone 3: routing -->
  <g transform="translate(620,90)">
    <rect width="260" height="560" rx="34" fill="#1A202C"/>
    <rect x="10" y="10" width="240" height="540" rx="26" fill="#FFFFFF"/>
    <rect x="95" y="18" width="70" height="16" rx="8" fill="#1A202C"/>
    <text x="24" y="62" font-size="13" fill="#4A5568">‹ Back</text>
    <text x="236" y="62" text-anchor="end" font-size="12" fill="#4A5568">Step 4 of 4</text>
    <rect x="24" y="72" width="212" height="6" rx="3" fill="#B4530E"/>
    <text x="24" y="106" font-size="15" font-weight="700" fill="#1A202C">Who fixes this?</text>
    <rect x="24" y="118" width="212" height="210" rx="12" fill="#E9F5F2" stroke="#3A9284" stroke-width="2"/>
    <text x="38" y="142" font-size="10" font-weight="700" fill="#1F6B5F">STATE ROAD · SR 0051</text>
    <text x="38" y="164" font-size="14" font-weight="700" fill="#1A202C">PennDOT District 11</text>
    <text x="38" y="184" font-size="11" fill="#4A5568">Saw Mill Run Blvd is maintained</text>
    <text x="38" y="199" font-size="11" fill="#4A5568">by the state, not the city.</text>
    <text x="38" y="222" font-size="11" fill="#1A202C">☎  1-800-FIX-ROAD</text>
    <text x="38" y="242" font-size="11" fill="#1A202C">🌐  Customer care web form</text>
    <text x="38" y="262" font-size="11" fill="#1A202C">🕘  24/7</text>
    <text x="38" y="290" font-size="10" fill="#4A5568">In: City of Pittsburgh</text>
    <text x="38" y="312" font-size="10" fill="#1B4F86" text-decoration="underline">Wrong office? Tell us</text>
    <rect x="24" y="344" width="102" height="44" rx="22" fill="#1B4F86"/>
    <text x="75" y="371" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Call</text>
    <rect x="134" y="344" width="102" height="44" rx="22" fill="#FFFFFF" stroke="#1B4F86" stroke-width="2"/>
    <text x="185" y="371" text-anchor="middle" font-size="13" font-weight="700" fill="#1B4F86">Email / Web</text>
    <rect x="24" y="404" width="212" height="56" rx="10" fill="#FFF4EC"/>
    <text x="34" y="426" font-size="11" fill="#1A202C">Your report goes on the community</text>
    <text x="34" y="444" font-size="11" fill="#1A202C">map so neighbors can say "Me too".</text>
    <rect x="24" y="480" width="212" height="44" rx="22" fill="#B4530E"/>
    <text x="130" y="507" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Submit report</text>
  </g>
  <text x="750" y="680" text-anchor="middle" font-size="14" font-weight="700" fill="#1A202C">Smart routing result</text>
  <text x="750" y="700" text-anchor="middle" font-size="12" fill="#4A5568">Explains why, one tap to contact</text>

  <!-- Phone 4: my reports -->
  <g transform="translate(910,90)">
    <rect width="260" height="560" rx="34" fill="#1A202C"/>
    <rect x="10" y="10" width="240" height="540" rx="26" fill="#FFFFFF"/>
    <rect x="95" y="18" width="70" height="16" rx="8" fill="#1A202C"/>
    <text x="24" y="66" font-size="16" font-weight="700" fill="#1A202C">My Reports</text>
    <g font-size="11" text-anchor="middle">
      <rect x="24" y="80" width="62" height="26" rx="13" fill="#1B4F86"/><text x="55" y="97" fill="#FFFFFF">All (6)</text>
      <rect x="90" y="80" width="70" height="26" rx="13" fill="#EDF2F7"/><text x="125" y="97" fill="#1A202C">Open (4)</text>
      <rect x="164" y="80" width="72" height="26" rx="13" fill="#EDF2F7"/><text x="200" y="97" fill="#1A202C">Fixed (2)</text>
    </g>
    <g font-size="11" fill="#1A202C">
      <rect x="24" y="118" width="212" height="76" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="32" y="126" width="60" height="60" rx="8" fill="#CBD5E0"/>
      <text x="102" y="142" font-weight="700">Pothole</text>
      <text x="102" y="158" fill="#4A5568">Brownsville Rd · Oct 2</text>
      <rect x="102" y="166" width="90" height="20" rx="10" fill="#1B4F86"/>
      <text x="147" y="180" text-anchor="middle" fill="#FFFFFF" font-size="10">Sent to agency</text>

      <rect x="24" y="204" width="212" height="76" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="32" y="212" width="60" height="60" rx="8" fill="#CBD5E0"/>
      <text x="102" y="228" font-weight="700">Landslide</text>
      <text x="102" y="244" fill="#4A5568">Route 51 · Sep 28</text>
      <rect x="102" y="252" width="70" height="20" rx="10" fill="#B4530E"/>
      <text x="137" y="266" text-anchor="middle" fill="#FFFFFF" font-size="10">Reported</text>

      <rect x="24" y="290" width="212" height="76" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="32" y="298" width="60" height="60" rx="8" fill="#CBD5E0"/>
      <text x="102" y="314" font-weight="700">Streetlight</text>
      <text x="102" y="330" fill="#4A5568">Murray Ave · Sep 12</text>
      <rect x="102" y="338" width="70" height="20" rx="10" fill="#3A9284"/>
      <text x="137" y="352" text-anchor="middle" fill="#FFFFFF" font-size="10">Resolved ✓</text>
    </g>
    <rect x="24" y="380" width="212" height="70" rx="10" fill="#EAF1F8"/>
    <text x="34" y="402" font-size="11" fill="#1A202C">Guest account: 2 of 3 reports today.</text>
    <text x="34" y="420" font-size="11" fill="#1A202C">Sign in to keep your history on</text>
    <text x="34" y="438" font-size="11" fill="#1B4F86" font-weight="700">every device ›</text>
    <rect x="10" y="494" width="240" height="56" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="130" cy="494" r="26" fill="#B4530E"/>
    <text x="130" y="503" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">+</text>
    <text x="45" y="530" text-anchor="middle" font-size="10" fill="#4A5568">Map</text>
    <text x="130" y="538" text-anchor="middle" font-size="10" fill="#4A5568">Report</text>
    <text x="190" y="530" text-anchor="middle" font-size="10" font-weight="700" fill="#1B4F86">Mine</text>
    <text x="230" y="530" text-anchor="middle" font-size="10" fill="#4A5568">Me</text>
  </g>
  <text x="1040" y="680" text-anchor="middle" font-size="14" font-weight="700" fill="#1A202C">My Reports</text>
  <text x="1040" y="700" text-anchor="middle" font-size="12" fill="#4A5568">Status chips use text + color</text>
</svg>
